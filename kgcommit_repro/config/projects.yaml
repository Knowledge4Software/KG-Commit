# ---------------------------------------------------------------------------
# KG-Commit per-project registry.
#
# The active project is chosen at runtime via the KGC_PROJECT env var, e.g.
#   PowerShell:  $env:KGC_PROJECT = 'zookeeper'
#   bash:        export KGC_PROJECT=zookeeper
#
# Paths are RELATIVE to the repo root (the parent of kgcommit_repro/); data is
# read in place. `base_commit` must be set before building a project -- run
#   python kgcommit_repro/find_base_commit.py
# to get a paste-ready value. Projects with base_commit: "" are not yet buildable.
#
# Commit counts (ApacheJIT labelled set) are noted to pick LIGHT projects first.
# ---------------------------------------------------------------------------

neo4j:                                # shared default; a project may override under its own `neo4j:` key
  uri: bolt://localhost:7687
  user: neo4j
  password: password1234

projects:

  # ---- light projects (build these first) -------------------------------
  zookeeper:                          # 839 labelled commits
    project_key: apache/zookeeper
    repo_subpath: repos/apache/zookeeper
    base_commit: "bbc3fdc9973cf02256539a794b617c9b0da5b81f"   # first substantial Java commit (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_zookeeper.csv
    diff_csv:  data/apachejit/projects/apache_zookeeper_diff.csv
    output_namespace: zookeeper

  zeppelin:                           # 1,451 labelled commits
    project_key: apache/zeppelin
    repo_subpath: repos/apache/zeppelin
    base_commit: "a8208011ea59384745ce3e55e97b880ff0ecb89d"   # first substantial Java commit (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_zeppelin.csv
    diff_csv:  data/apachejit/projects/apache_zeppelin_diff.csv
    output_namespace: zeppelin

  kafka:                              # 2,384 labelled commits
    project_key: apache/kafka
    repo_subpath: repos/apache/kafka
    base_commit: "472723f1cccb8cb1e74ef52e47ccb2fbdc6c3e3d"   # first substantial Java commit (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_kafka.csv
    diff_csv:  data/apachejit/projects/apache_kafka_diff.csv
    output_namespace: kafka

  # ---- medium projects --------------------------------------------------
  hadoop-mapreduce:                   # 1,321 labelled commits
    project_key: apache/hadoop-mapreduce
    # ApacheJIT mined the "hadoop-mapreduce" commits from the apache/hadoop MONOREPO
    # (pre/post repo-split history), NOT the short-lived apache/hadoop-mapreduce
    # spin-off (only ~960 commits). Only 525/1321 SHAs resolve in the spin-off, so
    # the spin-off yields an incomplete graph. Build from the monorepo where all
    # 1321 SHAs resolve.
    # Primary = spin-off repo: it owns the base_commit and the earliest 525
    # labelled commits (2009-2011), so Phase A's base-snapshot `git checkout
    # BASE_COMMIT` works unchanged. The monorepo is the extra, supplying the 796
    # later commits (2011-2019) whose SHAs do not exist in the spin-off.
    # See docs/Critical_notes.tex.
    repo_subpath: repos/apache/hadoop-mapreduce  # primary: base + 525 early commits
    extra_repo_subpaths:                          # multi-repo build
      - repos/apache/hadoop                       # monorepo: 796 later commits (2011-2019)
    base_commit: "867a8565cf219e79250a3ca9ad77b8a5448694ea"   # earliest labelled commit (spin-off, 2009-05-19)
    label_csv: data/apachejit/projects/apache_hadoop-mapreduce.csv
    diff_csv:  data/apachejit/projects/apache_hadoop-mapreduce_diff.csv
    output_namespace: hadoop-mapreduce

  hadoop-hdfs:                        # 2,907 labelled commits
    # MULTI-REPO (like hadoop-mapreduce): ApacheJIT's hdfs SHAs split across the
    # apache/hadoop-hdfs spin-off (461 spin-off-only; 142 in both) and the
    # apache/hadoop MONOREPO (2,304 monorepo-only). The SPIN-OFF is primary: A2
    # streams the primary in FULL, so it must be the SMALL repo (spin-off = 1,134
    # commits) not the 28k-commit monorepo (full-streaming the monorepo is
    # prohibitively slow). The base commit resolves in both, so Phase A's
    # `git checkout <base>` works on the spin-off. See docs/Critical_notes.tex.
    project_key: apache/hadoop-hdfs
    repo_subpath: repos/apache/hadoop-hdfs       # primary: spin-off (small; base + full-stream context)
    extra_repo_subpaths:
      - repos/apache/hadoop                      # monorepo: labelled-only (2,304 monorepo-only commits)
    base_commit: "4ba4f741d159e83fffe40b0d6ced5ce3f15619f4"   # earliest labelled commit (in both; 277 .java in spin-off)
    label_csv: data/apachejit/projects/apache_hadoop-hdfs.csv
    diff_csv:  data/apachejit/projects/apache_hadoop-hdfs_diff.csv
    output_namespace: hadoop-hdfs

  activemq:                           # 6,126 labelled commits
    project_key: apache/activemq
    repo_subpath: repos/apache/activemq
    base_commit: "8f1763f078525b3cbfd30dd8389d3f61da56ac78"   # first substantial Java commit (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_activemq.csv
    diff_csv:  data/apachejit/projects/apache_activemq_diff.csv
    output_namespace: activemq

  # ---- heavy projects (build last) --------------------------------------
  groovy:                             # 8,059 labelled commits -- the paper's primary subject
    project_key: apache/groovy
    repo_subpath: repos/apache/groovy
    base_commit: "408b29851d7bbe4d343340832297e4be7e0c5578"   # known first substantial Java commit
    label_csv: data/apachejit/projects/apache_groovy.csv
    diff_csv:  data/apachejit/projects/apache_groovy_diff.csv
    output_namespace: groovy

  hive:                               # 6,842 labelled commits (single-repo; all SHAs resolve in the clone)
    project_key: apache/hive
    repo_subpath: repos/apache/hive
    base_commit: "be7e270c27d84362f44b8e9a079f56dd046d6ffd"   # first substantial Java commit (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_hive.csv
    diff_csv:  data/apachejit/projects/apache_hive_diff.csv
    output_namespace: hive

  spark:                              # 1,465 labelled commits (single-repo)
    project_key: apache/spark
    repo_subpath: repos/apache/spark
    base_commit: "df47b40b764e25cbd10ce49d7152e1d33f51a263"   # first substantial Java commit (find_base_commit.py --scan 120)
    label_csv: data/apachejit/projects/apache_spark.csv
    diff_csv:  data/apachejit/projects/apache_spark_diff.csv
    output_namespace: spark

  cassandra:                          # 8,159 labelled commits
    project_key: apache/cassandra
    repo_subpath: repos/apache/cassandra
    base_commit: "cf56f8f3acbeac0ddff9ee3131ad7abe2a919ba3"   # 313 .java files at base (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_cassandra.csv
    diff_csv:  data/apachejit/projects/apache_cassandra_diff.csv
    output_namespace: cassandra

  hbase:                              # 8,730 labelled commits
    project_key: apache/hbase
    repo_subpath: repos/apache/hbase
    base_commit: "89af8294f42a9a16b91a09f7808653a71648718f"   # 29 .java at base (find_base_commit.py)
    label_csv: data/apachejit/projects/apache_hbase.csv
    diff_csv:  data/apachejit/projects/apache_hbase_diff.csv
    output_namespace: hbase

  flink:                              # 11,691 labelled commits
    project_key: apache/flink
    repo_subpath: repos/apache/flink
    base_commit: ""
    label_csv: data/apachejit/projects/apache_flink.csv
    diff_csv:  data/apachejit/projects/apache_flink_diff.csv
    output_namespace: flink

  ignite:                             # 12,036 labelled commits
    project_key: apache/ignite
    repo_subpath: repos/apache/ignite
    base_commit: ""
    label_csv: data/apachejit/projects/apache_ignite.csv
    diff_csv:  data/apachejit/projects/apache_ignite_diff.csv
    output_namespace: ignite
