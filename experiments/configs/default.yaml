# Default configuration for JIT defect prediction experiments

# Data configuration
data:
  path: "data/apachejit/apachejit_train.csv"
  label_column: "buggy"
  timestamp_column: "author_date"
  test_path: "data/apachejit/apachejit_test_small.csv"

# Preprocessing configuration
preprocessing:
  label_column: "buggy"
  include_text: true
  feature_columns: null  # Auto-detect

# Streaming configuration
streaming:
  window_size: 50
  window_step: 50

# Model configuration
model:
  type: "online"
  classes: [0, 1]
  classifier_kwargs:
    max_iter: 1000
    tol: 1e-3

# Training configuration
training:
  type: "incremental"

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]

# Output configuration
output:
  logs_dir: "outputs/logs"
  metrics_dir: "outputs/metrics"
  models_dir: "outputs/models"
  plots_dir: "outputs/plots"
  results_dir: "outputs/results"
  results_file: "outputs/results.json"

# Knowledge graph configuration
knowledge_graph:
  enabled: false          # set to true or pass --use-kg to augment features
  recent_window: 10       # number of recent commits used for recent_bug_rate

# Experiment configuration
experiment:
  name: "baseline_experiment"
  description: "Basic JIT defect prediction experiment"
  random_state: 42